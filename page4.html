<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect"
      href="https://fonts.googleapis.com">
    <link rel="preconnect"
      href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap"
      rel="stylesheet">
    <style type="text/tailwindcss">
        @theme{
        --color-primary-50:  #eff6ff;
        --color-primary-100: #dbeafe;
        --color-primary-200: #bfdbfe;
        --color-primary-300: #93c5fd;
        --color-primary-400: #60a5fa;
        --color-primary-500: #3b82f6;
        --color-primary-600: #2563eb;
        --color-primary-700: #1d4ed8;
        --color-primary-800: #1e40af;
        --color-primary-900: #1e3a8a;
        --color-primary-950: #172554;

        --color-main-1: #290044;
        --color-main-2: #500071;
        --color-main-3: #8A2A78;
        --color-main-4: #EEE3B0;

        --font-prompt: 'Prompt',sans-serif;
        }
    </style>
</head>
<body>
    <div class="bg-primary-500 text-white p-4">Hello,Thani </div>

    <p class="text-main-1 bg-main-4 font-prompt">Thani</p>
    <p class="text-main-2 bg-main-3 font-prompt">Thani</p>
    <p class="text-main-3 bg-main-2 font-prompt">Thani</p>
    <p class="text-main-4 bg-main-1 font-prompt">Thani</p>
</body>
</html>
